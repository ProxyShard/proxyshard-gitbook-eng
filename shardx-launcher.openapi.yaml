openapi: 3.0.3

info:
  title: "ShardX Launcher; Automation API"
  version: "0.1.0"
  description: "Local HTTP API for automating the ShardX anti-detect browser launcher: generate fingerprints, create/launch/close profiles, and obtain a Chrome DevTools Protocol (CDP) WebSocket endpoint to drive a launched profile with Puppeteer / Playwright. ## Binding & lifecycle The server runs inside the launcher app, bound to **127.0.0.1** only, on the port configured in *Settings → Automation API* (default **40325**). It is **not** reachable from other hosts. Enabling/port changes take effect after the app restarts. ## Authentication Every endpoint except `GET /health` requires a **Bearer JWT** (HS256, signed with the launcher's stored secret): Authorization: Bearer <token> The permanent token is shown in *Settings → Automation API* (copy it from there). Pressing **Regenerate token** rotates the signing secret live; the new token works immediately and every previously issued token is invalidated at once. There is no separate API key and no token-minting endpoint: the token itself is the credential. Missing/invalid token → `401` with an empty body. ## Typical flow 1. `GET /fingerprint/new/{platform}` → a fully uniquified fingerprint (random platform_version, host-aware CPU/RAM, clamped screen, library noise prefs), **not** persisted. 2. Optionally edit the returned `fingerprint` object (e.g. flip `noise.fonts.enabled`, set `webrtc`, tweak `navigator`). 3. `POST /profiles` (or `POST /folders/{folder}/profiles`) with that object as `fingerprint` → the launcher stores it **verbatim** (create never re-randomizes). 4. `POST /profiles/{id}/start` → returns the CDP endpoint; connect with `browserWSEndpoint = cdp.web_socket_debugger_url`. 5. `POST /profiles/{id}/stop` when done. ## Proxies & QUIC/WebRTC On **every** launch (UI or API), before the browser starts, the bound proxy is probed live for UDP-relay (SOCKS5 UDP_ASSOCIATE). If UDP works, QUIC is enabled and WebRTC may use the proxied UDP relay; otherwise QUIC is disabled and WebRTC collapses to TCP-only so the real IP can't leak. Timezone/locale/geo `auto` fields are resolved live through the proxy at launch too. Passing `proxy` (string) on a persistent create adds it to the store and full-tests it up front; a temporary profile keeps it inline. ## Temporary profiles `POST /profiles/temporary` creates a profile flagged `temporary`: it is hidden from `GET /profiles` and from the launcher UI, and is deleted (config + user-data-dir) automatically when its browser closes. If the app crashes while one is open, it is purged on the next app start. ## Fingerprint object The `fingerprint` returned by `GET /fingerprint/new*` and accepted by the create endpoints is the launcher's native FingerprintConfig. It is round-tripped verbatim, so the schema below documents the common sub-objects but is intentionally open (`additionalProperties: true`). ## MCP server A companion **MCP** (Model Context Protocol) server lets an AI client drive the launcher through *this* API plus a profile's browser over CDP. It is a separate Node process; **not** part of this HTTP API and not hosted by it. Get it from the launcher (**Settings → MCP server → Download MCP server**, or the sidebar \"Download MCP\" button), which saves the source to a folder you choose; or from the repo at `rust/shardx-launcher/mcp/`. Under the hood it just calls this API: configure it with `SHARDX_API` (this base URL) and `SHARDX_TOKEN` (the Bearer token from *Settings → Automation API*). It exposes: - **API tools**; thin wrappers over the endpoints below (profiles, fingerprints, proxies, folders, cookies, start/stop). - **Browser tools** (patchright over CDP); `browser_navigate`, `browser_evaluate`, `browser_screenshot`, `browser_click`, `browser_fill`, tabs, waits, etc., targeting a profile started via `POST /profiles/{id}/start` (which returns the CDP endpoint). Run it standalone over **stdio** (the client spawns it) or, with `MCP_HTTP_PORT` set, over HTTP at `127.0.0.1:<port>/mcp`. See the MCP server's README for setup. (The launcher only downloads it; it does not run it.)"
servers:
  - url: http://127.0.0.1:40325
    description: Local launcher (default port; change in Settings)

security:
  - bearerAuth: []

tags:
  - name: System
  - name: Fingerprints
  - name: Profiles
  - name: Folders
  - name: Proxies
  - name: Extensions
  - name: Bookmarks
  - name: Trash
  - name: Automation

paths:
  /health:
    get:
      tags: [ System ]
      summary: "Liveness check"
      description: Returns basic server info. The only endpoint that does **not** require auth.
      security: []
      responses:
        "200":
          description: Server is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  name: { type: string, example: shardx-launcher }
                  version: { type: string, example: "0.1.0" }

  /fingerprint/new:
    get:
      tags: [ Fingerprints ]
      summary: Generate a new fingerprint (host OS)
      description: "Returns a fully uniquified fingerprint for the **host** operating system, without persisting it. Equivalent to `/fingerprint/new/{platform}` with the launcher host's platform."
      responses:
        "200":
          description: A uniquified, unsaved fingerprint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FingerprintEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: The fingerprint library is empty.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /fingerprint/new/{platform}:
    get:
      tags: [ Fingerprints ]
      summary: Generate a new fingerprint for a platform
      description: "Picks a random library fingerprint matching `platform`, then uniquifies it: a fresh Sec-CH-UA `platform_version`, host-aware `hardware_concurrency`/`device_memory` (never claims more than the real machine), and a screen clamped to the real display. Returned unsaved; feed it to a create endpoint as `fingerprint`."
      parameters:
        - name: platform
          in: path
          required: true
          description: Case-insensitive; `win`/`osx`/`darwin` aliases accepted.
          schema:
            type: string
            enum: [ Windows, macOS, Linux ]
      responses:
        "200":
          description: A uniquified, unsaved fingerprint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FingerprintEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No matching fingerprint and the library is empty.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /profiles:
    get:
      tags: [ Profiles ]
      summary: List profiles
      description: "Lists persistent profiles (temporary profiles are hidden), newest first, pinned on top. Each entry is enriched with live run state."
      responses:
        "200":
          description: Profile list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProfileListItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [ Profiles ]
      summary: Create a profile
      description: "Persists a profile from a client-supplied `fingerprint` **exactly as given** (no re-randomization; uniquification already happened in `/fingerprint/new`). Use `folder` to file it; bind a proxy by stored `proxy_id` or attach one inline via `proxy` (a string that is NOT saved to the proxy store)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProfileRequest" }
      responses:
        "200":
          description: Created profile metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileMeta" }
        "400":
          description: Missing/!object `fingerprint`, or an unparseable proxy string.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /profiles/temporary:
    post:
      tags: [ Profiles ]
      summary: Create a temporary profile
      description: "Creates a profile from a random (or specified) library fingerprint, uniquified like `/fingerprint/new` and stored verbatim, flagged `temporary`: hidden from listings and **auto-deleted when its browser closes** (or purged on next app start after a crash). Pair with `POST /profiles/{id}/start`."
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TempProfileRequest" }
      responses:
        "200":
          description: Created temporary profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  fingerprint_id:
                    type: string
                    description: The library entry the profile was generated from.
                  temporary: { type: boolean, example: true }
                  proxy_inline:
                    type: boolean
                    description: Whether an inline proxy string was attached.
        "400":
          description: Unparseable proxy string, or an unknown noise vector.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No matching fingerprint / empty library.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /profiles/{id}:
    get:
      tags: [ Profiles ]
      summary: Get a profile
      description: "Returns the full stored profile: the `_meta` envelope plus the flattened FingerprintConfig. If the profile is running, `running` and `cdp` are added."
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: The stored profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [ Profiles ]
      summary: Delete a profile
      description: "Moves the profile to Trash. It can be restored for 7 days. The archive includes cookies, logins, web data, preferences, Local Storage, and IndexedDB. Cache data is excluded. The original configuration and user data directory are deleted after the archive is created. Temporary profiles are deleted automatically when their browser closes and are not moved to Trash."
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: "Profile moved to Trash."
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
                  id: { type: string, format: uuid }
                  trashed:
                    type: boolean
                    example: true
                    description: "Can be restored from Trash for 7 days."
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: Deletion failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      tags: [ Profiles ]
      summary: Edit a profile
      description: "Updates only the provided fields. When `fingerprint` is given it REPLACES the stored fingerprint verbatim (no re-randomization). `folder: \"\"` unfiles the profile; `proxy_id: \"\"` unbinds the proxy; a `proxy` string is stored (deduped) + full-tested, then bound. Returns the updated stored profile."
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditProfileRequest" }
      responses:
        "200":
          description: Updated stored profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredProfile" }
        "400":
          description: Bad fingerprint (not an object) or unparseable proxy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /profiles/{id}/start:
    post:
      tags: [ Profiles ]
      summary: Launch a profile (with CDP)
      description: "Spawns the ShardX browser for the profile with remote-debugging enabled, resolves any `auto` timezone/locale/geo from the bound proxy, and returns the CDP endpoint once Chrome has written its DevToolsActivePort. CDP is enabled **only** on API launches (UI launches stay debugging-free for anti-detect). The call waits up to 30 seconds for the endpoint; if it still has none, `cdp` is `null` and `cdp_error` says what happened and where to read the port yourself. Works for both regular and temporary profiles."
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: false
        description: Optional. Empty body launches headed.
        content:
          application/json:
            schema:
              type: object
              properties:
                headless:
                  type: boolean
                  default: false
                  description: Launch headless (--headless=new).
      responses:
        "200":
          description: Launched.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile_id: { type: string }
                  pid: { type: integer, format: int64, description: OS process id. }
                  headless: { type: boolean }
                  cdp:
                    nullable: true
                    allOf: [ { $ref: "#/components/schemas/CdpInfo" } ]
                  cdp_error:
                    type: string
                    nullable: true
                    description: "Why `cdp` is null, when it is. Absent otherwise."
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: Binary not configured / spawn failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /profiles/{id}/stop:
    post:
      tags: [ Profiles ]
      summary: Stop a profile
      description: "Sends the browser a graceful shutdown (SIGTERM on Unix; 5s grace then SIGKILL). Temporary profiles are deleted as part of close. `stopped` is `false` if the profile wasn't running."
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: Stop requested.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile_id: { type: string }
                  stopped: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /profiles/{id}/cookies:
    get:
      tags: [ Profiles ]
      summary: Export cookies
      description: "Reads the profile's Chromium cookie store and returns all cookies **decrypted**. Works whether the profile is running or stopped. Empty array if the profile has never launched."
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: Cookies.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cookies:
                    type: array
                    items: { $ref: "#/components/schemas/Cookie" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: Cookie DB read/decrypt failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [ Profiles ]
      summary: Import cookies
      description: "Writes cookies into the profile's cookie store (re-encrypting to Chromium's v10 scheme). The profile **must be stopped**; a running browser rewrites the store on exit and would clobber the import."
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ cookies ]
              properties:
                cookies:
                  type: array
                  items: { $ref: "#/components/schemas/Cookie" }
      responses:
        "200":
          description: Imported.
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: { type: integer, description: Number of cookies written. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: "Profile is running; stop it first."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Cookie DB write failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /folders:
    get:
      tags: [ Folders ]
      summary: List folders
      description: Distinct, non-empty folder tags across persistent profiles.
      responses:
        "200":
          description: Folder names.
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
                example: [ "work", "scrapers" ]
        "401": { $ref: "#/components/responses/Unauthorized" }

  /folders/{folder}:
    patch:
      tags: [ Folders ]
      summary: Rename a folder
      description: Retags every profile in the folder. Returns the count.
      parameters:
        - name: folder
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ name ]
              properties:
                name: { type: string, description: New folder name. }
      responses:
        "200":
          description: Renamed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  renamed_to: { type: string }
                  profiles: { type: integer, description: Profiles retagged. }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [ Folders ]
      summary: Delete a folder
      description: "Deletes the folder tag. With `delete_profiles=true` the profiles in it are deleted too; otherwise they're unfiled (moved to \"All\")."
      parameters:
        - name: folder
          in: path
          required: true
          schema: { type: string }
        - name: delete_profiles
          in: query
          required: false
          description: Delete the profiles in the folder (default false = unfile).
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted_folder: { type: string }
                  delete_profiles: { type: boolean }
                  profiles: { type: integer, description: Profiles affected. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /folders/{folder}/profiles:
    post:
      tags: [ Folders ]
      summary: Create a profile in a folder
      description: "Same as `POST /profiles`, but the folder comes from the path (overriding any `folder` in the body)."
      parameters:
        - name: folder
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProfileRequest" }
      responses:
        "200":
          description: Created profile metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileMeta" }
        "400":
          description: Missing/!object `fingerprint`, or an unparseable proxy string.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /fingerprints:
    get:
      tags: [ Fingerprints ]
      summary: List library fingerprints
      description: The on-disk fingerprint library (GPU presets) the launcher ships/imports.
      responses:
        "200":
          description: Library entries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LibraryEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /running:
    get:
      tags: [ Profiles ]
      summary: List running profiles
      description: Profiles with a live browser process, including the CDP endpoint when launched via the API.
      responses:
        "200":
          description: Running profiles.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RunningProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /proxies:
    get:
      tags: [ Proxies ]
      summary: List stored proxies
      description: Proxies saved in the launcher store. **Credentials (username/password) are never returned.**
      responses:
        "200":
          description: Proxy summaries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProxySummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [ Proxies ]
      summary: Add a proxy
      description: "Adds a proxy to the store (deduped by endpoint). Pass `proxy` as a string, or explicit `host`/`port` (+ `kind`/`username`/`password`)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddProxyRequest" }
      responses:
        "200":
          description: Stored proxy summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxySummary" }
        "400":
          description: Unparseable proxy / missing host+port.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /proxies/{id}:
    delete:
      tags: [ Proxies ]
      summary: Delete a proxy
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
                  id: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /extensions:
    get:
      tags: [ Extensions ]
      summary: "List extensions"
      description: "Returns extensions available to profiles. Use an extension `id` in the `extensions` field of `POST /profiles` or `PATCH /profiles/{id}`. Icons are omitted because data URLs can be large. `POST /extensions` includes the icon of the added extension."
      responses:
        "200":
          description: "Extension list."
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Extension" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [ Extensions ]
      summary: Add an extension
      description: "Provide either `url` or `path`. `url` can be a Chrome Web Store page, a 32-character extension ID, or a direct `.crx` or `.zip` URL. `path` can be a local `.crx`, `.zip`, or unpacked folder on the launcher host. The extension name, version, description, and icon are read from its `manifest.json`, including `__MSG_*__` placeholders resolved with the default locale."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddExtensionRequest" }
      responses:
        "200":
          description: "Extension added. The response includes `icon`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Extension" }
        "400":
          description: Neither `url` nor `path` given, the link is not an extension, or the store has no such id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /extensions/{id}:
    delete:
      tags: [ Extensions ]
      summary: Remove an extension
      description: "Profiles hold ids, not copies, so any profile naming this extension stops loading it from its next launch. Their stored list is left as it is; re-adding the extension does not restore the binding."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
                  id: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /bookmarks:
    get:
      tags: [ Bookmarks ]
      summary: "List bookmarks"
      responses:
        "200":
          description: Every bookmark, across folders.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Bookmark" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [ Bookmarks ]
      summary: "Create or update a bookmark"
      description: "With `id`, updates the bookmark; without `id`, creates it. A bookmark assigned to a folder appears in the bookmarks bar of every profile in that folder, inside **ShardX**. `folder: \"\"` applies to every profile. Only this managed folder is changed. The update is applied at the next profile launch; a running profile does not see it."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookmarkRequest" }
      responses:
        "200":
          description: The saved bookmark.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bookmark" }
        "400":
          description: "`url` is required."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /bookmarks/{id}:
    delete:
      tags: [ Bookmarks ]
      summary: Delete a bookmark
      description: It leaves its profiles on their next launch.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
                  id: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /trash:
    get:
      tags: [ Trash ]
      summary: List deleted profiles
      description: "Returns profiles archived by `DELETE /profiles/{id}`, newest first, with their restoration expiration time. Expired entries are deleted when the launcher starts."
      responses:
        "200":
          description: The trash.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TrashEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /trash/{id}/restore:
    post:
      tags: [ Trash ]
      summary: Restore a deleted profile
      description: "Restores the profile with its original ID. The archive is deleted after the profile is restored. Cookies, logins, web data, preferences, history, bookmarks, Local Storage, and IndexedDB are restored. Cache data is rebuilt on the next launch."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The restored profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "No deleted profile with this ID."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /trash/{id}:
    delete:
      tags: [ Trash ]
      summary: Delete a trashed profile for good
      description: "Permanently deletes the profile archive. This action cannot be undone."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Purged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  purged: { type: boolean, example: true }
                  id: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /automation/projects:
    get:
      tags: [ Automation ]
      summary: List automation projects
      description: "Every project saved in the launcher, with its blocks and run settings. These are the same projects the desktop **Automation** section edits."
      responses:
        "200":
          description: "Project list."
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AutomationProject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [ Automation ]
      summary: "Create project"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, description: "Uses `Untitled` when empty." }
      responses:
        "200":
          description: "Created project."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationProject" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /automation/projects/{id}:
    get:
      tags: [ Automation ]
      summary: "Get project"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Project details."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationProject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "Project not found."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      tags: [ Automation ]
      summary: "Replace project"
      description: "Replaces the entire project. Send the object returned by `GET`. The path ID takes precedence over the body ID. A missing project returns `404`; use `POST /automation/projects` to create one."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationProject" }
      responses:
        "200":
          description: "Saved project."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationProject" }
        "400":
          description: "Invalid project object."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "Project not found."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [ Automation ]
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
                  id: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "Project not found."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/projects/{id}/duplicate:
    post:
      tags: [ Automation ]
      summary: "Duplicate project"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Duplicated project."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationProject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "Project not found."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/projects/{id}/export:
    get:
      tags: [ Automation ]
      summary: "Export project bundle"
      description: "Parameters the project marked secret are emptied on the way out, so a bundle can be handed on without taking a password with it. The import side asks for them again."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Export bundle."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationBundle" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "Project not found."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/import:
    post:
      tags: [ Automation ]
      summary: "Import project bundle"
      description: The bundle arrives as a new project with a new id.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationBundle" }
      responses:
        "200":
          description: "Imported project."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationProject" }
        "400":
          description: "Invalid bundle or unsupported format version."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /automation/projects/{id}/run:
    post:
      tags: [ Automation ]
      summary: "Start project"
      description: "Starts the project and returns immediately. Project blocks start the required browsers. Use `/status` to monitor progress. Returns `400` if the project is already running or has no enabled steps."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Project started."
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_id: { type: string, format: uuid }
                  running: { type: boolean, example: true }
        "400":
          description: "Project is already running or has no enabled steps."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "Project not found."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501":
          description: "This build does not support automation."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/projects/{id}/stop:
    post:
      tags: [ Automation ]
      summary: "Stop project"
      description: "Requests that the run stop. Each browser finishes its current step before closing. Use `/status` to monitor the `running` field."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Stop requested."
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_id: { type: string, format: uuid }
                  stopping: { type: boolean, example: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501":
          description: "This build does not support automation."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/projects/{id}/status:
    get:
      tags: [ Automation ]
      summary: "Get project run status"
      description: "Returns `null` if the project is not running and has not run since launcher startup. `log` contains the recent entries shown in the fleet window. The full log is stored under `automation-runs/`."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Run status or `null`."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AutomationRun"
                  - type: "null"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501":
          description: "This build does not support automation."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/runs:
    get:
      tags: [ Automation ]
      summary: "List active runs"
      responses:
        "200":
          description: "Active run list."
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AutomationRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501":
          description: "This build does not support automation."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/modules:
    get:
      tags: [ Automation ]
      summary: List installed modules
      description: "Returns WebAssembly modules installed by the operator. Each module adds blocks with the kind `module:<module id>:<block>`. Modules return actions for the runner and do not access the page directly."
      responses:
        "200":
          description: "Module list."
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AutomationModule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501":
          description: "This build does not support automation."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [ Automation ]
      summary: "Install module"
      description: "`path` must point to a local `.wasm` file on the launcher host. Modules contain native code created by the operator."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ path ]
              properties:
                path: { type: string, example: "/home/me/module.wasm" }
      responses:
        "200":
          description: The installed module.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationModule" }
        "400":
          description: "Missing path or unsupported module file."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501":
          description: "This build does not support automation."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/modules/{id}:
    delete:
      tags: [ Automation ]
      summary: "Remove module"
      description: "Projects that use the module stop working. Existing project definitions are not modified."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
                  id: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "Module not found."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501":
          description: "This build does not support automation."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Permanent JWT from Settings → Automation API.

  parameters:
    ProfileId:
      name: id
      in: path
      required: true
      description: Profile UUID.
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Missing or invalid Bearer token.

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
      required: [ error ]

    FingerprintEnvelope:
      type: object
      properties:
        fingerprint: { $ref: "#/components/schemas/Fingerprint" }
      required: [ fingerprint ]

    Fingerprint:
      type: object
      description: "Native FingerprintConfig. Documented sub-objects are the common ones; the object is open and stored verbatim by the create endpoints, so any field present here is round-tripped."
      additionalProperties: true
      properties:
        name: { type: string }
        notes: { type: string }
        seed:
          type: integer
          description: 0 = overrides-only mode (the common case).
        navigator:
          type: object
          additionalProperties: true
          properties:
            user_agent: { type: string }
            platform: { type: string, example: "Win32" }
            hardware_concurrency: { type: integer, example: 12 }
            device_memory: { type: integer, enum: [ 8, 16, 32 ], example: 16 }
            language: { type: string }
            do_not_track: { type: boolean }
        screen:
          type: object
          additionalProperties: true
          properties:
            width: { type: integer }
            height: { type: integer }
            avail_width: { type: integer }
            avail_height: { type: integer }
            color_depth: { type: integer, example: 24 }
            device_pixel_ratio: { type: number, example: 2 }
            color_gamut: { type: string, enum: [ "", srgb, p3, rec2020 ] }
            refresh_rate:
              type: integer
              minimum: 24
              maximum: 480
              example: 60
              description: "How often the claimed display refreshes. Absent means 60. See the refresh_rate field on the create/edit requests."
        client_hints:
          type: object
          description: Sec-CH-UA family (browser.vision calls this `hints`).
          additionalProperties: true
          properties:
            platform: { type: string }
            platform_version: { type: string }
            architecture: { type: string, example: "x86" }
            bitness: { type: string, example: "64" }
            mobile: { type: boolean }
        webgl:
          type: object
          additionalProperties: true
          properties:
            unmasked_vendor: { type: string }
            unmasked_renderer: { type: string }
        webgpu:
          type: object
          additionalProperties: true
        webrtc:
          type: string
          description: WebRTC handling mode.
          enum: [ auto, tcp_only, block ]
        noise:
          $ref: "#/components/schemas/NoisePrefs"
        network:
          type: object
          properties:
            blocked_ports:
              type: array
              items: { type: integer }
              description: Local-network port-scan defense (ports_protection).
        timezone:
          type: string
          description: IANA name, or "auto" to resolve from the bound proxy at launch.

    NoisePrefs:
      type: object
      description: "Per-vector anti-fingerprint noise. Each block is `{enabled, seed}` (+ feature-specific knobs). `enabled:false` = pass-through."
      properties:
        canvas: { $ref: "#/components/schemas/NoiseBlock" }
        webgl:
          allOf: [ { $ref: "#/components/schemas/NoiseBlock" } ]
          properties:
            intensity: { type: number }
        audio:
          allOf: [ { $ref: "#/components/schemas/NoiseBlock" } ]
          properties:
            intensity: { type: number }
        client_rects:
          allOf: [ { $ref: "#/components/schemas/NoiseBlock" } ]
          properties:
            max_offset: { type: number }
        sensors: { $ref: "#/components/schemas/NoiseBlock" }
        fonts:
          allOf: [ { $ref: "#/components/schemas/NoiseBlock" } ]
          description: "`enabled:true` hides a small deterministic per-profile subset of non-essential fonts (real host fonts otherwise pass through)."
    NoiseBlock:
      type: object
      properties:
        enabled: { type: boolean }
        seed:
          type: integer
          description: Per-profile entropy; 0 = derive automatically.

    CreateProfileRequest:
      type: object
      required: [ fingerprint ]
      properties:
        name: { type: string }
        notes: { type: string }
        proxy_id:
          type: string
          description: Bind a proxy already in the store (by id).
        proxy:
          type: string
          description: "Attach a proxy by string (`host:port:user:pass` or `scheme://user:pass@host:port`). On a **persistent** profile it is added to the proxy store (deduped by endpoint) and full-tested (UDP + geo), then bound by id; so it appears in the proxy list and QUIC/WebRTC gating has a cached result. On a **temporary** profile it is attached inline (not stored). Ignored if `proxy_id` is set."
          example: "socks5://user:pass@1.2.3.4:1080"
        folder:
          type: string
          description: Folder tag (ignored on /folders/{folder}/profiles, which wins).
        color:
          type: string
          description: "Accent for the profile's window icon and for the pill carrying its name in the omnibox. Omit it and the icon derives a colour from the name while the pill keeps the browser's own toolbar colour."
          example: "#2FCB80"
        extensions:
          type: array
          items: { type: string }
          description: "Extension-library ids (`GET /extensions`), loaded at launch. An id the library does not hold is a 400 rather than a profile that silently starts without it."
        refresh_rate:
          type: integer
          minimum: 24
          maximum: 480
          example: 60
          description: "Claimed display refresh rate, written into `screen.refresh_rate`. No web API reports it; a page measures it by timing requestAnimationFrame, which is why leaving it out is not neutral; absent means 60, what most machines report, rather than whatever the host's own screen does. Frames can only be slowed, so the effective rate is the closest whole division of the host's panel at or under this."
        fingerprint:
          allOf: [ { $ref: "#/components/schemas/Fingerprint" } ]
          description: Stored verbatim. Get one from /fingerprint/new and edit as needed.

    EditProfileRequest:
      type: object
      description: "All fields optional; only what's present is changed."
      properties:
        name: { type: string }
        notes: { type: string }
        folder: { type: string, description: '"" unfiles (moves to All).' }
        proxy_id: { type: string, description: '"" unbinds the proxy.' }
        proxy:
          type: string
          description: "Proxy string; stored (deduped) + full-tested, then bound."
        color:
          type: string
          description: '`#rrggbb`; "" goes back to the name-derived colour.'
        extensions:
          type: array
          items: { type: string }
          description: Replaces the whole list; `[]` loads none.
        refresh_rate:
          type: integer
          minimum: 24
          maximum: 480
          example: 60
          description: "Claimed display refresh rate, applied AFTER `fingerprint` and written into `screen.refresh_rate`. No web API reports it; a page measures it by timing requestAnimationFrame, which is why leaving it out is not neutral; absent means 60, what most machines report, rather than whatever the host's own screen does. Frames can only be slowed, so the effective rate is the closest whole division of the host's panel at or under this."
        fingerprint:
          allOf: [ { $ref: "#/components/schemas/Fingerprint" } ]
          description: When present, REPLACES the stored fingerprint verbatim.

    TempProfileRequest:
      type: object
      properties:
        fingerprint_id:
          type: string
          description: Library entry to base off; random match for `platform` when omitted.
        platform:
          type: string
          enum: [ Windows, macOS, Linux ]
          description: Used to pick a random fingerprint when `fingerprint_id` is omitted; host OS when both omitted.
        proxy:
          type: string
          description: Inline proxy string (not saved to the store).
        name: { type: string }
        folder: { type: string }
        refresh_rate:
          type: integer
          minimum: 24
          maximum: 480
          example: 60
          description: "Claimed display refresh rate, written into `screen.refresh_rate`. No web API reports it; a page measures it by timing requestAnimationFrame, which is why leaving it out is not neutral; absent means 60, what most machines report, rather than whatever the host's own screen does. Frames can only be slowed, so the effective rate is the closest whole division of the host's panel at or under this."
        noise:
          type: object
          description: "Per-vector fingerprint noise. Omitted vectors keep their defaults (disabled). Two formats can be combined: shorthand `{\"canvas\": true, \"webgl\": true}`, which also applies the UI default intensity to `webgl` and `client_rects`, and a full object such as `{\"canvas\": {\"enabled\": true, \"seed\": 42}}`, matching the format returned by `GET /profiles/{id}`. Fields are merged with the existing vector settings. A missing or zero `seed` generates a stable value from the profile ID."
          additionalProperties:
            oneOf:
              - type: boolean
              - type: object
                properties:
                  enabled: { type: boolean }
                  seed: { type: integer, format: int64 }
                  intensity: { type: number, description: "`webgl` only." }
                  max_offset: { type: number, description: "`client_rects` only." }
          properties:
            canvas: {}
            webgl: {}
            audio: {}
            client_rects: {}
            sensors: {}
            fonts: {}
          example:
            canvas: true
            webgl: { enabled: true, intensity: 0.0005 }
            fonts: true

    Extension:
      type: object
      properties:
        id: { type: string, description: Pass this in a profile's `extensions`. }
        name: { type: string }
        version: { type: string }
        description: { type: string }
        size_bytes: { type: integer, format: int64 }
        added_at: { type: string, description: "`@<unix_secs>`." }
        icon:
          type: string
          nullable: true
          description: "Largest icon the manifest declares, as a `data:` URL. Null on the listing endpoint and on extensions that ship none."
    AddExtensionRequest:
      type: object
      description: Exactly one of `url` or `path`.
      properties:
        url:
          type: string
          description: "A Chrome Web Store page, a bare 32-character extension id, or a direct link to a `.crx` / `.zip`."
          example: https://chromewebstore.google.com/detail/rabby-wallet/acmacodkjbdgmoleebolmdjonilkdbch
        path:
          type: string
          description: A local `.crx`, `.zip` or unpacked folder on the launcher's machine.

    Bookmark:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        url: { type: string }
        folder:
          type: string
          description: Launcher folder; empty means every profile.

    BookmarkRequest:
      type: object
      required: [ url ]
      properties:
        id:
          type: string
          description: Present updates that bookmark; absent creates one.
        url:
          type: string
          description: "A bare host is fine; `https://` is added."
          example: facebook.com/ads/manager
        title:
          type: string
          description: Blank uses the address itself.
        folder:
          type: string
          description: Empty (or absent) means every profile.

    TrashEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        folder: { type: string }
        deleted_at: { type: integer, format: int64, description: Unix seconds. }
        expires_at:
          type: integer
          format: int64
          description: Unix seconds; the startup sweep removes anything past it.
        size_bytes:
          type: integer
          format: int64
          description: The archive, which holds the account and not the caches.

    ProfileMeta:
      type: object
      description: Launcher-facing profile metadata (returned by create).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        notes: { type: string }
        proxy_id: { type: string, nullable: true }
        last_launched_at: { type: string, nullable: true, description: ISO-8601 or null. }
        created_at: { type: string, nullable: true }
        pinned: { type: boolean }
        folder: { type: string }
        color:
          type: string
          nullable: true
          description: "Icon accent as `#rrggbb`; `null` means it is derived from the name, which is what the browser does when nothing is chosen."
        extensions:
          type: array
          items: { type: string }
          description: Extension-library ids loaded at launch.

    ProfileListItem:
      allOf:
        - $ref: "#/components/schemas/ProfileMeta"
        - type: object
          properties:
            running: { type: boolean }
            pid: { type: integer, format: int64, nullable: true }
            cdp:
              nullable: true
              allOf: [ { $ref: "#/components/schemas/CdpInfo" } ]

    StoredProfile:
      type: object
      description: "Full on-disk profile: the `_meta` envelope plus the flattened FingerprintConfig (all `Fingerprint` fields appear at the top level). `running`/`cdp` are present only while the profile runs."
      additionalProperties: true
      properties:
        _meta:
          type: object
          properties:
            id: { type: string, format: uuid }
            proxy_id: { type: string, nullable: true }
            inline_proxy:
              nullable: true
              allOf: [ { $ref: "#/components/schemas/ProxyEntry" } ]
            last_launched_at: { type: string, nullable: true }
            created_at: { type: string, nullable: true }
            pinned: { type: boolean }
            folder: { type: string }
            temporary: { type: boolean }
            rev:
              type: integer
              description: "Bumped by every write. The desktop editor sends back the number it opened the profile at, so a save that would land on top of a change made through this API is refused rather than silently reverting it. API edits are never refused; they read the profile and write it back in one step."
        running: { type: boolean }
        cdp:
          nullable: true
          allOf: [ { $ref: "#/components/schemas/CdpInfo" } ]

    CdpInfo:
      type: object
      description: Chrome DevTools Protocol endpoint of a running profile.
      properties:
        port: { type: integer, description: Chrome-chosen remote-debugging port. }
        http_url:
          type: string
          example: "http://127.0.0.1:53217"
          description: REST base (/json, /json/version).
        web_socket_debugger_url:
          type: string
          example: "ws://127.0.0.1:53217/devtools/browser/ab12-..."
          description: Browser-level WS endpoint for Puppeteer/Playwright `connect`.

    RunningProfile:
      type: object
      properties:
        profile_id: { type: string }
        pid: { type: integer, format: int64 }
        cdp:
          nullable: true
          allOf: [ { $ref: "#/components/schemas/CdpInfo" } ]

    LibraryEntry:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        platform: { type: string, enum: [ Windows, macOS, Linux ] }
        chrome: { type: string, description: Chrome version string. }
        gpu: { type: string }
        builtin: { type: boolean, description: Part of the bundled starter set. }

    AddProxyRequest:
      type: object
      description: A proxy string OR explicit fields (string wins).
      properties:
        proxy:
          type: string
          description: "`scheme://user:pass@host:port` or `host:port:user:pass`."
        kind: { type: string, enum: [ socks5, http, https ] }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        password: { type: string }
        name: { type: string }
        country: { type: string }
        notes: { type: string }

    ProxySummary:
      type: object
      description: Stored proxy without credentials.
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [ socks5, http, https ] }
        host: { type: string }
        port: { type: integer }
        country: { type: string, description: Informational tag (e.g. "US"). }

    Cookie:
      type: object
      description: "A cookie in a tool-friendly shape (compatible with EditThisCookie / Puppeteer exports; `httpOnly`/`sameSite` are accepted as aliases on import)."
      required: [ domain, name, value ]
      properties:
        domain:
          type: string
          description: Cookie host (Chromium `host_key`), e.g. ".example.com".
        name: { type: string }
        value: { type: string }
        path: { type: string, default: "/" }
        expires:
          type: number
          nullable: true
          description: Unix seconds; null/absent = session cookie.
        secure: { type: boolean, default: false }
        http_only: { type: boolean, default: false }
        same_site:
          type: string
          enum: [ Strict, Lax, None, unspecified ]
          description: Case-insensitive on import.

    ProxyEntry:
      type: object
      description: Full proxy (as embedded in `_meta.inline_proxy`).
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [ socks5, http, https ] }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        password: { type: string }
        country: { type: string }
        notes: { type: string }

    AutomationBranch:
      description: "Where the run goes after a step. A plain string for the simple cases, an object for the ones carrying a value."
      oneOf:
        - type: string
          enum: [ next, stop, endpass ]
          description: "`next`; the step below. `stop`; end this profile's whole run. `endpass`; end this pass; the next one starts from the top."
        - type: object
          properties:
            goto: { type: string, description: "Block id to jump to; one that no longer exists behaves as next." }
        - type: object
          properties:
            retry: { type: integer, description: "Try this same step again, that many more times, then take next." }

    AutomationBlock:
      type: object
      description: "One step. `kind` and `params` are open; a module can add a kind this build has never heard of."
      properties:
        id: { type: string }
        kind:
          type: string
          description: "A built-in palette kind (`goto`, `click`, `type`, `profile.create`, `var.set`, ...) or `module:<module id>:<block>`. On a mobile profile, common actions use touch input: `click` taps, `rightClick` performs a long press, and `scroll` and `swipe` use touch gestures. `hover` is unavailable because mobile devices have no pointer. The following mobile-only steps are rejected on desktop profiles: | kind | params | action | | --- | --- | --- | | `touch.tap` | `selector` or `x`+`y`, `tapCount` (1-3), `timeout` | Tap the target. | | `touch.longPress` | `selector` or `x`+`y`, `timeout` | Press and hold. | | `touch.swipe` | `selector` or `x`+`y`, `dx`, `dy`, `timeout` | Swipe. | | `touch.drag` | `selector`, `to`, `holdMs`, `timeout` | Drag an element. | | `touch.pinch` | `scale`, `selector` or `x`+`y` | Pinch to zoom. Values above 1 zoom out. | | `screen.rotate` | `angle` (0/90/180/270), `turnMs`, `into` | Rotate the device. `into` stores the new `screen.orientation.type`. |"
          example: click
        label: { type: string }
        params:
          type: object
          additionalProperties: true
          description: The step's own fields, as the palette defines them.
        enabled: { type: boolean, default: true }
        x: { type: number, description: "Canvas position. Layout only; the run follows the branches." }
        y: { type: number }
        on_done: { $ref: "#/components/schemas/AutomationBranch" }
        on_fail:
          allOf:
            - $ref: "#/components/schemas/AutomationBranch"
          description: "Defaults to `stop`; carrying on after a click that found nothing is how a run types into the wrong page."
        secrets:
          type: array
          items: { type: string }
          description: Parameter names emptied on export.

    AutomationRunSettings:
      type: object
      properties:
        threads: { type: integer, default: 1, description: "Browsers running at once; clamped to 1-64." }
        loops: { type: integer, default: 1, description: "Passes over the blocks. 0 means run until `hours` is up." }
        hours: { type: number, description: "Only meaningful when `loops` is 0." }
        start: { type: string, description: "Block id to start at; empty means the first." }
        profiles:
          type: array
          items: { type: string }
          description: Kept for projects saved before profiles became blocks; one thread each when set.

    AutomationProject:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        notes: { type: string }
        blocks:
          type: array
          items: { $ref: "#/components/schemas/AutomationBlock" }
        run: { $ref: "#/components/schemas/AutomationRunSettings" }
        created_at: { type: integer, description: "Unix seconds." }
        updated_at: { type: integer, description: "Unix seconds." }

    AutomationBundle:
      type: object
      description: A project on its way to another machine.
      properties:
        format: { type: integer, example: 1, description: "An import refuses a number it does not know." }
        exported_at: { type: integer, description: "Unix seconds." }
        project: { $ref: "#/components/schemas/AutomationProject" }
        modules:
          type: array
          items: { type: string }
          description: Module ids the steps need.
        module_files:
          type: array
          description: "Those modules' files, carried inside the bundle so an imported project can run where it lands. A module missing from disk at export time is left out here but still named in `modules`. On import, a module already installed under the same id is kept as it is rather than overwritten."
          items:
            type: object
            properties:
              id: { type: string }
              wasm: { type: string, description: "The .wasm, gzipped then base64." }
        needs:
          type: array
          description: What export blanked, so an import can ask for exactly that.
          items:
            type: object
            properties:
              block_id: { type: string }
              label: { type: string }
              params:
                type: array
                items: { type: string }

    AutomationWorker:
      type: object
      description: One browser inside a run.
      properties:
        profile_id: { type: string }
        profile_name: { type: string }
        pass: { type: integer, description: "1-based; 0 before the first pass starts." }
        step: { type: integer }
        steps_total: { type: integer }
        status: { type: string, enum: [ queued, starting, running, done, failed, stopped ] }
        note: { type: string }

    AutomationRun:
      type: object
      properties:
        project_id: { type: string, format: uuid }
        project_name: { type: string }
        started_at: { type: integer, description: "Unix seconds." }
        running: { type: boolean }
        workers:
          type: array
          items: { $ref: "#/components/schemas/AutomationWorker" }
        log:
          type: array
          items: { type: string }
          description: The tail the fleet window shows; the whole log is on disk under `automation-runs/`.

    AutomationModule:
      type: object
      properties:
        id: { type: string, description: "File stem; also the prefix every one of its block kinds carries." }
        name: { type: string }
        path: { type: string }
        blocks:
          type: array
          items: { type: object, additionalProperties: true }
          description: Block descriptors, in the same shape as the built-in palette.
        error: { type: string, description: "Empty when the module loaded; otherwise why it did not." }

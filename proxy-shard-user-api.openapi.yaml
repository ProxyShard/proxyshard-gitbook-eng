# ============================================================================
# ShardX User API: OpenAPI 3.0.3.
#
# ИСТОЧНИК ПРАВДЫ по публичному API. Раньше спека жила только в GitBook
# (docs.shardx.com/proxyshard-api/*), из-за чего расходилась с кодом
# незаметно: ответы ручек уже отдавали message и proxy_password, а спека
# продолжала обещать старую форму.
#
# Правила:
#   * добавил/изменил ручку в services/user-api - правь этот файл в ТОМ ЖЕ
#     коммите;
#   * теги = страницы в GitBook, менять их имена без нужды не стоит;
#   * после мержа залить файл в GitBook (OpenAPI-спека проекта), иначе
#     клиенты снова увидят устаревшее.
#
# Проверка перед заливкой:
#   python -m openapi_spec_validator services/user-api/openapi.yaml
# ============================================================================
openapi: 3.0.3
info:
  title: ShardX User API Billing
  version: 1.3.1
servers:
  - url: https://user-api.shardx.com
security:
  - bearerAuth: []
tags:
  - name: General
    description: General operations (profile, orders, reference data)
  - name: Datacenter & ISP Proxies
    description: Operations for datacenter and ISP proxies
  - name: Residential Proxies
    description: Operations for residential proxies
  - name: Service
    description: Health probes (no authentication)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      description: |
        Optional. A unique identifier of the logical operation (1-128 characters of `[A-Za-z0-9_.:-]`), for example a UUID.
        Send the SAME key when retrying a request whose outcome you do not know (timeout, dropped connection): a request that already completed is NOT executed again, its original response is returned.

        Accepted on EVERY mutating endpoint (`POST`/`PUT`/`PATCH`/`DELETE`) of this API: purchase, renewal, bandwidth top-up, add-ons and any endpoint added later; it is listed explicitly on the money-moving ones.

        * All endpoints except sub-user operations: the stored response is replayed with the `Idempotency-Replayed: true` header for 7 days. `409`: a request with this key is still running (`idempotency_state: in_progress`) or never completed and its outcome must be verified manually (`idempotency_state: unknown`; it is never re-executed). `422`: the key was already used with a different request. A `429` from the rate limiter does not consume the key, so retry with the same one.
        * Sub-user endpoints (create, `data/add`, `data/subtract`): the key is forwarded to the proxy provider, and a retry within 24 hours cannot change the quota twice. `409`: the operation is still in progress or the key was used with a different payload.

        Without the header, requests run as usual, without these guarantees.
      schema:
        type: string
        maxLength: 128
        pattern: ^[A-Za-z0-9_.:-]+$
  responses:
    BadRequest:
      description: |
        Invalid request; the reason is in `message`. Most checks answer with JSON (`ApiError`), a few answer with a plain-text body (`Content-Type: text/plain`): `Invalid proxy type`, `User don't have active order with this proxy type`, `User resident not set for user` (residential endpoints), `Addon not available for this product`, `Invalid addons_json` and the add-on quantity checks (add-on endpoints, purchase and calculation with add-ons), and errors returned by the proxy server on `signature/set` and `del-np/set`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
        text/plain:
          schema:
            type: string
            example: Invalid proxy type
    Unauthorized:
      description: 'Missing or invalid API key: `Missing or invalid Authorization header`, `Invalid API key`, `API key mismatch`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServerError:
      description: |
        Internal error. The API also answers `500` when the order (or another record it needs) is not found or does not belong to your account; `message` names it, for example `Order not found`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UpstreamError:
      description: 'The proxy provider failed or answered with an error (`Upstream error: <status>`)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: |
        More than one request per 3 seconds from the account. The body is plain text (`Too many requests, retry in <N>s`), and the `x-ratelimit-after` header has the wait in seconds. The Idempotency-Key is not consumed: retry with the same one.
      content:
        text/plain:
          schema:
            type: string
            example: Too many requests, retry in 2s
    IdempotencyConflict:
      description: |
        A request with this Idempotency-Key is still running (`idempotency_state: in_progress`), or it never completed and its outcome must be checked manually (`idempotency_state: unknown`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    IdempotencyMismatch:
      description: The Idempotency-Key was already used with a different request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ActiveProxyItem:
      type: object
      properties:
        ip:
          type: string
        username:
          type: string
        password:
          type: string
        http_port:
          type: integer
        socks_port:
          type: integer
        until:
          type: string
          description: "ISO 8601 date string"
        status:
          type: string
        signature:
          type: string
          nullable: true
          description: p0f signature assigned to the IP, null when not set
      required:
        - ip
        - username
        - password
        - http_port
        - socks_port
        - until
        - status
    ApiError:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        rejected:
          type: boolean
          description: 'Sub-user operations: `true` when the provider rejected the operation and nothing changed'
        idempotency_state:
          type: string
          enum:
            - in_progress
            - unknown
          description: Only in a `409` from the Idempotency-Key check
        order_id:
          type: integer
          description: 'Only in a `502` from purchase and add-bandwidth: the order that was paid for'
        refunded:
          type: boolean
          description: 'Only in a `502` from purchase and add-bandwidth: `true` means the payment was returned to the wallet, `false` means the refund is pending, contact support'
      required:
        - success
        - message
    AddonLine:
      type: object
      description: "One add-on line stored on an order"
      properties:
        addon_key:
          type: string
        catalog_id:
          type: integer
        qty:
          type: integer
          description: "Units active in the current period"
        price_per_unit:
          type: integer
          description: "Unit price in cents at purchase time"
        pending:
          description: "Change scheduled for the next renewal, or `null`"
          nullable: true
          type: object
          properties:
            action:
              type: string
              enum:
                - cancel
                - downgrade
            next_qty:
              type: integer
              description: "Target quantity after downgrade"
    PurchaseRequestDcIsp:
      type: object
      description: "Purchase for Datacenter/ISP; the location field is required."
      properties:
        product:
          type: string
          enum:
            - Datacenter Proxy
            - ISP Proxy
        location:
          type: string
        cycle:
          type: string
        quantity:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
        promo_code:
          type: string
          nullable: true
        auto_renewal:
          type: boolean
          default: false
        addons:
          type: array
          nullable: true
          description: "Add-ons attached at purchase time, for example `p0f_slots` for DC or ISP"
          items:
            $ref: '#/components/schemas/CreateOrderAddonRequest'
      required:
        - product
        - location
        - cycle
    PurchaseRequestResidentialStandard:
      type: object
      description: "Purchase for Standart Residential Proxy; location is not required; the cycle is fixed (lifetime)."
      properties:
        product:
          type: string
          enum:
            - Standart Residential Proxy
        quantity:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
        promo_code:
          type: string
          nullable: true
        addons:
          type: array
          nullable: true
          description: "Add-ons attached at purchase time, for example `p0f_slots` for DC or ISP"
          items:
            $ref: '#/components/schemas/CreateOrderAddonRequest'
      required:
        - product
    PurchaseRequestResidentialPremium:
      type: object
      description: "Purchase for Premium Residential Proxy; location is not required; the cycle is fixed (lifetime)."
      properties:
        product:
          type: string
          enum:
            - Premium Residential Proxy
        quantity:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
        promo_code:
          type: string
          nullable: true
        addons:
          type: array
          nullable: true
          description: "Add-ons attached at purchase time, for example `p0f_slots` for DC or ISP"
          items:
            $ref: '#/components/schemas/CreateOrderAddonRequest'
      required:
        - product
    PurchaseRequestResidentialUnmetered:
      type: object
      description: "Purchase for Unmetered Residential proxy; supports auto-renewal."
      properties:
        product:
          type: string
          enum:
            - Unmetered Residential proxy
        cycle:
          type: string
        promo_code:
          type: string
          nullable: true
        auto_renewal:
          type: boolean
          default: false
        addons:
          type: array
          nullable: true
          description: "Add-ons attached at purchase time, for example `p0f_slots` for DC or ISP"
          items:
            $ref: '#/components/schemas/CreateOrderAddonRequest'
      required:
        - product
        - cycle
    PurchaseRequest:
      type: object
      properties:
        product:
          type: string
        location:
          type: string
          nullable: true
        cycle:
          type: string
        quantity:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
        promo_code:
          type: string
          nullable: true
        auto_renewal:
          type: boolean
          default: false
        addons:
          type: array
          nullable: true
          description: "Add-ons attached at purchase time, for example `p0f_slots` for DC or ISP"
          items:
            $ref: '#/components/schemas/CreateOrderAddonRequest'
      required:
        - product
        - cycle
    PurchaseResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        order_id:
          type: integer
      required:
        - success
        - message
        - order_id
    ProductWithCycles:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        cycles:
          type: array
          items:
            type: string
      required:
        - name
        - cycles
    AvailableCountResponse:
      type: object
      properties:
        country:
          type: string
        product:
          type: string
        amount:
          type: integer
      required:
        - country
        - product
        - amount
    ApiMeResponse:
      type: object
      properties:
        email:
          type: string
        active_orders:
          type: integer
        wallet_balance:
          type: integer
          description: in cents
      required:
        - email
        - active_orders
        - wallet_balance
    ApiSuccess:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success
    AvailableCountRequest:
      type: object
      properties:
        country:
          type: string
        product:
          type: string
      required:
        - country
        - product
    AddBandwidthRequest:
      type: object
      properties:
        amount:
          type: integer
          description: Amount in GB (1 GB = 1 073 741 824 bytes), up to 100 000
        promo_code:
          type: string
          nullable: true
      required:
        - amount
    GetSubUsersRequest:
      type: object
      properties:
        offset:
          type: integer
          description: Offset (default 0)
        limit:
          type: integer
          description: Page size (default 20)
    EditSubUserPayload:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    CreateSubUserPayload:
      type: object
      description: Either `data` or `data_bytes` is required; `data_bytes` takes precedence.
      properties:
        proxy_type:
          type: string
        name:
          type: string
        data:
          type: integer
          description: Amount in GB (1 GB = 1 073 741 824 bytes), up to 100 000
        data_bytes:
          type: integer
          format: int64
          description: Amount in bytes (exact; takes precedence over `data`), up to 100 000 GB
      required:
        - proxy_type
        - name
    ChangeSubUserPasswordPayload:
      type: object
      properties:
        proxy_type:
          type: string
      required:
        - proxy_type
    ModifyTrafficPayload:
      type: object
      description: Either `data` or `data_bytes` is required; `data_bytes` takes precedence.
      properties:
        proxy_type:
          type: string
        data:
          type: integer
          description: Amount in GB (1 GB = 1 073 741 824 bytes), up to 100 000
        data_bytes:
          type: integer
          format: int64
          description: Amount in bytes (exact; takes precedence over `data`), up to 100 000 GB
      required:
        - proxy_type
    AnalyticsSeries:
      type: object
      description: |
        The provider's answer, passed through unchanged. Its shape depends on `kind`:
        * `overall`: `results` are time buckets `{timestamp, data, requests}`, empty intervals included as zeros; buckets are hourly on a short window and daily on a long one;
        * `domains`: `results` are hostnames `{hostname, data, requests}`, sorted by `data` descending; there is no `count`;
        * `connections`: `results` are open connections `{user_id, package_id, server_ip, connections}` right now; there is no period (`timezone`, `start`, `end`).
      properties:
        count:
          type: integer
          description: Total number of results (`overall`)
        next:
          type: string
          nullable: true
          description: Link to the next page
        previous:
          type: string
          nullable: true
          description: Link to the previous page
        timezone:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        results:
          type: array
          items:
            type: object
            properties:
              timestamp:
                type: string
                format: date-time
                description: Start of the bucket (`overall`)
              hostname:
                type: string
                description: Destination host (`domains`)
              data:
                type: integer
                format: int64
                description: Bytes (`overall`, `domains`)
              requests:
                type: integer
                description: Requests (`overall`, `domains`)
              user_id:
                type: string
                description: Account or sub-user id (`connections`)
              package_id:
                type: string
                description: Package id (`connections`)
              server_ip:
                type: string
                description: IP of the gateway that holds the connections (`connections`)
              connections:
                type: integer
                description: Open connections (`connections`)
    SubUserOrderState:
      type: object
      nullable: true
      description: Sub-user quota state AFTER the operation (null when the provider returned no order object)
      properties:
        proxy_password:
          type: string
        data:
          type: integer
          format: int64
          description: Total assigned quota in bytes
        data_spent:
          type: integer
          format: int64
          description: Consumed bytes
        data_remain:
          type: integer
          format: int64
          description: Remaining bytes (may be negative on overdraft)
    Country:
      type: object
      properties:
        code:
          type: string
          maxLength: 10
          description: ISO country code
        name:
          type: string
          maxLength: 255
          description: Country name
      required:
        - code
        - name
    Region:
      type: object
      properties:
        code:
          type: string
          maxLength: 10
          description: "Region or state code"
        name:
          type: string
          maxLength: 255
          description: "Region or state name"
        country:
          $ref: '#/components/schemas/Country'
      required:
        - code
        - name
        - country
    City:
      type: object
      properties:
        code:
          type: string
          maxLength: 50
          description: "City code, usually a slug"
        name:
          type: string
          maxLength: 255
          description: City name
        country:
          $ref: '#/components/schemas/Country'
        region:
          type: object
          nullable: true
          properties:
            code:
              type: string
              maxLength: 10
              description: Region code
            name:
              type: string
              maxLength: 255
              description: Region name
          required:
            - code
            - name
      required:
        - code
        - name
        - country
    PagedCountriesResponse:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Country'
      required:
        - count
        - results
    PagedRegionsResponse:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Region'
      required:
        - count
        - results
    PagedCitiesResponse:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/City'
      required:
        - count
        - results
    Isp:
      type: object
      properties:
        code:
          type: string
          description: "ISP code, usually a slug"
        name:
          type: string
          description: ISP name
        country:
          $ref: '#/components/schemas/Country'
        region:
          type: object
          nullable: true
          properties:
            code:
              type: string
              description: Region code
            name:
              type: string
              description: Region name
          required:
            - code
            - name
      required:
        - code
        - name
        - country
    PagedIspsResponse:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Isp'
      required:
        - count
        - results
    CreateOrderAddonRequest:
      type: object
      properties:
        addon_key:
          type: string
          example: p0f_slots
        qty:
          type: integer
          minimum: 1
      required:
        - addon_key
        - qty
paths:
  /user/api/proxies/active:
    get:
      tags:
        - Datacenter & ISP Proxies
      summary: Get active proxies by order
      parameters:
        - in: query
          name: order_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Proxy list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActiveProxyItem'
                  order_tag:
                    type: string
                    nullable: true
                required:
                  - success
                  - data
        '400':
          description: The order has no proxy credentials yet (`Missing authtoken in order`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Method is unavailable for this order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
  /user/api/orders/{order_id}/del-np/set:
    post:
      tags:
        - Datacenter & ISP Proxies
      summary: "Set per-IP deletion (del-np)"
      description: |
        Only for Datacenter & ISP proxies.
        Marked proxies keep working until the paid period ends and are deleted at the next renewal. The order's `quantity` and `price_paid` do NOT change now: the renewal charges for the proxies that remain (a proportional share of the order's price) and then updates them. See `renewal_quantity` and `renewal_price` in GET /user/api/orders/{order_id}.
      parameters:
        - in: path
          name: order_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      ip:
                        type: string
                      value:
                        type: boolean
                    required:
                      - ip
                      - value
              required:
                - items
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Validation error / not DC-ISP / keep=0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /user/api/orders/{order_id}/signature/set:
    post:
      tags:
        - Datacenter & ISP Proxies
      summary: "Set the IP OS fingerprint"
      description: "Sets the OS-fingerprint signature for one or more proxy IPs.  \nRequires the `p0f_slots` add-on to be active on the order.\n\nEach IP that receives a signature permanently occupies one slot.\nChanging the OS value on an IP that already has a signature does not consume an extra slot.\n\n**Available signature values:**\n\n| Value | OS |\n|-------|----|\n| `ios` | iOS |\n| `macos` | macOS |\n| `android` | Android |\n| `linux` | Linux |\n| `win10` | Windows 10 |\n| `win11` | Windows 11 |"
      parameters:
        - in: path
          name: order_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - ip
                      - signature
                    properties:
                      ip:
                        type: string
                      signature:
                        type: string
                        description: OS identifier to spoof.
                        enum:
                          - ios
                          - macos
                          - android
                          - linux
                          - win10
                          - win11
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  updated:
                    type: integer
                    description: Number of IPs updated
        '400':
          description: Validation error or not enough slots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /user/api/orders/{order_id}/addons/calculate:
    get:
      tags:
        - Datacenter & ISP Proxies
      summary: "Calculate add-on cost"
      description: "Returns the price preview for purchasing additional units of a given add-on for an active datacenter/ISP order. Currently the only supported add-on key is `p0f_slots`; OS-fingerprint signature slots."
      parameters:
        - in: path
          name: order_id
          required: true
          description: Order ID
          schema:
            type: integer
        - in: query
          name: addon_key
          required: true
          description: Add-on identifier (e.g. `p0f_slots`)
          schema:
            type: string
        - in: query
          name: add_qty
          required: true
          description: Number of units to add
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Price preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  addon_key:
                    type: string
                  catalog_id:
                    type: integer
                  price_per_unit:
                    type: integer
                    description: Price per unit in cents
                  current_qty:
                    type: integer
                  add_qty:
                    type: integer
                  new_qty:
                    type: integer
                  add_total:
                    type: integer
                    description: Total charge for this purchase in cents
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /user/api/orders/{order_id}/addons/purchase:
    post:
      tags:
        - Datacenter & ISP Proxies
      summary: Purchase an add-on
      description: |
        Immediately charges the wallet and adds the requested number of add-on units to the order. The order must be **active**. The only currently available add-on key is `p0f_slots`.
        Send an `Idempotency-Key` header to make retries safe (the wallet is charged).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: order_id
          required: true
          description: Order ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - addon_key
                - add_qty
              properties:
                addon_key:
                  type: string
                add_qty:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Add-on purchased
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  addons_price_paid:
                    type: integer
                    description: Cumulative add-on cost for this order (cents)
                  addons:
                    type: array
                    description: Updated add-on list stored on the order
                    items:
                      $ref: '#/components/schemas/AddonLine'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Another change of this order's add-ons ran at the same time (retry), or a request with this Idempotency-Key is in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
        '500':
          $ref: '#/components/responses/ServerError'
  /user/api/orders/{order_id}/addons/schedule:
    post:
      tags:
        - Datacenter & ISP Proxies
      summary: "Schedule an add-on downgrade"
      description: "Schedules a **downgrade** of an add-on to take effect on the next renewal cycle. The new quantity must be lower than the current one. The change is stored as a `pending` marker and applied automatically when the order renews."
      parameters:
        - in: path
          name: order_id
          required: true
          description: Order ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - addon_key
                - action
              properties:
                addon_key:
                  type: string
                action:
                  type: string
                  description: '`downgrade`: lower the quantity at the next renewal; `cancel`: remove the add-on at the next renewal'
                  enum:
                    - downgrade
                    - cancel
                next_qty:
                  type: integer
                  description: Required for `downgrade`; the quantity after renewal, lower than the current one (0 removes all units)
                  minimum: 0
      responses:
        '200':
          description: Downgrade scheduled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  addons:
                    type: array
                    items:
                      $ref: '#/components/schemas/AddonLine'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/ServerError'
  /user/api/orders/{order_id}/addons/schedule/cancel:
    post:
      tags:
        - Datacenter & ISP Proxies
      summary: "Cancel scheduled downgrade"
      description: Removes the pending downgrade that was set via the schedule endpoint.
      parameters:
        - in: path
          name: order_id
          required: true
          description: Order ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - addon_key
              properties:
                addon_key:
                  type: string
      responses:
        '200':
          description: Pending downgrade cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  addons:
                    type: array
                    items:
                      $ref: '#/components/schemas/AddonLine'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /user/api/orders/purchase:
    post:
      tags:
        - General
      summary: Create and pay for an order
      description: |
        Purchase by product name, location, and cycle. For Datacenter/ISP, location is required. For Standart Residential Proxy, location is not required.

        Send an `Idempotency-Key` header to make retries safe: without it, a retry after a timeout may charge the wallet and issue proxies twice.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/PurchaseRequestDcIsp'
                - $ref: '#/components/schemas/PurchaseRequestResidentialStandard'
                - $ref: '#/components/schemas/PurchaseRequestResidentialPremium'
                - $ref: '#/components/schemas/PurchaseRequestResidentialUnmetered'
                - $ref: '#/components/schemas/PurchaseRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseResponse'
        '400':
          description: Validation/balance error/insufficient stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: This billing cycle is not available for your account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          description: Stock check failed, or the proxies could not be issued after payment; then `order_id` and `refunded` tell whether the payment was returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /user/api/orders/calculate:
    get:
      tags:
        - General
      summary: "Calculate order cost"
      description: "Calculates price by product name, cycle name and quantity. Uses the same validation rules as purchase (allowed billing cycles, promo rules)."
      parameters:
        - in: query
          name: product
          required: true
          schema:
            type: string
        - in: query
          name: location
          required: false
          schema:
            type: string
            nullable: true
        - in: query
          name: cycle
          required: false
          schema:
            type: string
            nullable: true
        - in: query
          name: quantity
          required: false
          schema:
            type: integer
            nullable: true
        - in: query
          name: promo_code
          required: false
          schema:
            type: string
            nullable: true
        - in: query
          name: addons_json
          required: false
          description: URL-encoded JSON array of add-ons, e.g. [{"addon_key":"p0f_slots","qty":5}]
          schema:
            type: string
            nullable: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  original_price:
                    type: integer
                  final_price:
                    type: integer
                  discount_percent:
                    type: integer
                  addons_price:
                    type: integer
                    description: Add-ons total, minor units
                  total_with_addons:
                    type: integer
                    description: final_price + addons_price
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: This billing cycle is not available for your account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/ServerError'
  /user/api/orders/change-billing-cycle/{order_id}:

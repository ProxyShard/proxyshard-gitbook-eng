  /user/api/orders/{id}:
    get:
      tags:
        - General
      summary: Get order information
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order information
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  order:
                    type: object
                    properties:
                      order_id:
                        type: integer
                      product_name:
                        type: string
                      cycle_name:
                        type: string
                      quantity:
                        type: integer
                      price_paid:
                        type: integer
                        description: Base subscription price in cents
                      addons_price_paid:
                        type: integer
                        description: Total add-on cost in cents
                      addons:
                        type: array
                        description: Add-on lines attached to this order
                        items:
                          $ref: '#/components/schemas/AddonLine'
                      p0f_slots_available:
                        type: integer
                        description: Active p0f signature slots (from add-ons)
                      p0f_slots_used:
                        type: integer
                        description: Slots currently occupied by signed proxies
                      p0f_slots_next:
                        type: integer
                        description: Slots that will be active after the next renewal (capped by renewal_quantity)
                      renewal_quantity:
                        type: integer
                        description: Proxies in the next period (less than quantity if some are marked with del-np)
                      renewal_price:
                        type: integer
                        description: What the next renewal will charge, in cents (renewal_base_price + renewal_addons_price)
                      renewal_base_price:
                        type: integer
                        description: Proxies part of the next renewal, in cents (proportional share of price_paid)
                      renewal_addons_price:
                        type: integer
                        description: Add-ons part of the next renewal, in cents (pending changes applied)
                      status:
                        type: string
                      created_at:
                        type: string
                        nullable: true
                      expires_at:
                        type: string
                        nullable: true
                      promo_code:
                        type: string
                        nullable: true
                      auto_renewal:
                        type: boolean
                        nullable: true
                      tag:
                        type: string
                        nullable: true
                required:
                  - success
                  - order
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /user/api/orders/{id}/renew:
    post:
      tags:
        - General
      summary: Renew order
      description: |
        Renewal is available only when order status is `on-hold`.
        A repeated request for an order that is already renewed answers `200` with `Order already renewed`.
        Send an `Idempotency-Key` header to make retries safe (the wallet is charged).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: Order renewed successfully
                required:
                  - success
                  - message
        '400':
          description: Insufficient balance/validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The order is already paid for the current period, it changed while renewing (retry), or a request with this Idempotency-Key is in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
        '500':
          $ref: '#/components/responses/ServerError'
  /user/api/orders/{id}/tag:
    post:

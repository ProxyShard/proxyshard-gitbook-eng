  /user/api/orders:
    get:
      tags:
        - General
      summary: Order list
      parameters:
        - in: query
          name: status
          required: true
          description: active | on-hold | cancelled | all
          schema:
            type: string
        - in: query
          name: offset
          required: false
          description: Result offset (default 0)
          schema:
            type: integer
            minimum: 0
        - in: query
          name: limit
          required: false
          description: Page size (1..100, default 20)
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Order list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  orders:
                    type: array
                    items:
                      type: object
                      properties:
                        order_id:
                          type: integer
                        product_id:
                          type: integer
                        product_name:
                          type: string
                        cycle_id:
                          type: integer
                        cycle_name:
                          type: string
                        expires_at:
                          type: string
                          nullable: true
                          description: ISO8601 expiration time
                        auto_renewal:
                          type: boolean
                          nullable: true
                        tag:
                          type: string
                          nullable: true
                      required:
                        - order_id
                        - product_id
                        - product_name
                        - cycle_id
                        - cycle_name
                  count:
                    type: integer
                    description: Number of orders in the current result set
                  prev:
                    type: string
                    nullable: true
                    description: Previous page URI
                  next:
                    type: string
                    nullable: true
                    description: Next page URI
                required:
                  - success
                  - orders

  /user/api/proxies/analytics/{kind}:
    get:
      tags:
        - Residential Proxies
      summary: Account analytics
      description: |
        Traffic statistics of the account itself.

        `kind`:
        * `overall`: traffic and requests bucketed over the period;
        * `domains`: traffic and requests per destination hostname over the period;
        * `connections`: connections open right now (no period).

        By default only the account's own traffic is counted. Pass `include_sub_users=true` to add every sub-user of the account.
      parameters:
        - in: path
          name: kind
          required: true
          description: overall | domains | connections
          schema:
            type: string
            enum:
              - overall
              - domains
              - connections
        - in: query
          name: proxy_type
          required: true
          description: Proxy type (standart | premium | unlimited)
          schema:
            type: string
        - in: query
          name: start
          required: false
          description: Inclusive start of the window (ISO 8601, `YYYY-MM-DD HH:MM:SS` or Unix timestamp). Ignored for `connections`.
          schema:
            type: string
        - in: query
          name: end
          required: false
          description: Exclusive end of the window; defaults to now. Ignored for `connections`.
          schema:
            type: string
        - in: query
          name: timezone
          required: false
          description: IANA timezone for bucket boundaries, UTC by default
          schema:
            type: string
        - in: query
          name: include_sub_users
          required: false
          description: Count the account together with all of its sub-users (false by default)
          schema:
            type: boolean
        - in: query
          name: limit
          required: false
          description: Page size
          schema:
            type: integer
        - in: query
          name: offset
          required: false
          description: Number of results to skip
          schema:
            type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSeries'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
  /user/api/proxies/sub-user/{user_id}/analytics/{kind}:
    get:
      tags:
        - Residential Proxies
      summary: Sub-user analytics
      description: |
        The same statistics for a single sub-user of the account. Access is enforced by the provider: the request is made on behalf of the account, which can only read its own sub-users.
      parameters:
        - in: path
          name: user_id
          required: true
          description: Sub-user id at the provider
          schema:
            type: string
        - in: path
          name: kind
          required: true
          description: overall | domains | connections
          schema:
            type: string
            enum:
              - overall
              - domains
              - connections
        - in: query
          name: proxy_type
          required: true
          description: Proxy type (standart | premium | unlimited)
          schema:
            type: string
        - in: query
          name: start
          required: false
          description: Inclusive start of the window (ISO 8601, `YYYY-MM-DD HH:MM:SS` or Unix timestamp). Ignored for `connections`.
          schema:
            type: string
        - in: query
          name: end
          required: false
          description: Exclusive end of the window; defaults to now. Ignored for `connections`.
          schema:
            type: string
        - in: query
          name: timezone
          required: false
          description: IANA timezone for bucket boundaries, UTC by default
          schema:
            type: string
        - in: query
          name: limit
          required: false
          description: Page size
          schema:
            type: integer
        - in: query
          name: offset
          required: false
          description: Number of results to skip
          schema:
            type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSeries'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

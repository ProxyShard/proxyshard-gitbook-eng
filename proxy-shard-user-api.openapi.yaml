  /user/api/proxies/sub-user:
    post:
      tags:
        - Residential Proxies
      summary: Create sub-user
      description: |
        The quota is a virtual cap on top of the account's shared traffic pool: assigning it does not debit the pool; traffic is consumed only when the sub-user actually uses the proxy.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: query
          name: proxy_type
          required: true
          description: Proxy type (standart | premium | unlimited)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Either `data` or `data_bytes` is required; `data_bytes` takes precedence.
              properties:
                name:
                  type: string
                data:
                  type: integer
                  description: Amount in GB (1 GB = 1 073 741 824 bytes), up to 100 000
                data_bytes:
                  type: integer
                  format: int64
                  description: Amount in bytes (exact; takes precedence over `data`), up to 100 000 GB
              required:
                - name
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id:
                          type: string
                        first_name:
                          type: string
                        proxy_password:
                          type: string
                        data:
                          type: integer
                        data_spent:
                          type: integer
                        data_remain:
                          type: integer
                      required:
                        - user_id
                        - first_name
                        - proxy_password
                        - data
                        - data_spent
        '400':
          description: 'Validation error, or the provider rejected the request (`rejected: true`); nothing was created'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A request with this Idempotency-Key is in progress or was used with a different payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          description: 'Provider unreachable: the outcome is UNKNOWN; retry with the same Idempotency-Key'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
